<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CAPITÃO GLÓRIA — Edição Gore</title>
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden;display:flex;align-items:center;justify-content:center;font-family:Impact,Haettenschweiler,'Arial Narrow Bold',sans-serif}
  canvas{display:block;background:#111;cursor:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
"use strict";
// ================= CAPITÃO GLÓRIA — Edição Gore =================
// WASD mover | Mouse mirar | Botão esquerdo: olhos laser | Espaço/Botão direito: soco-voadora | P pausa
const W = 1280, H = 720, TAU = Math.PI * 2;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
cv.width = W; cv.height = H;
function fit() {
  const s = Math.min(innerWidth / W, innerHeight / H);
  cv.style.width = W * s + 'px'; cv.style.height = H * s + 'px';
}
addEventListener('resize', fit); fit();

const rnd = (a, b) => a + Math.random() * (b - a);
const rint = (a, b) => Math.floor(rnd(a, b + 1));
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const pick = a => a[Math.floor(Math.random() * a.length)];

// ---------- camadas persistentes (chão + sangue) ----------
const blood = document.createElement('canvas'); blood.width = W; blood.height = H;
const bctx = blood.getContext('2d');
const floor = document.createElement('canvas'); floor.width = W; floor.height = H;
(function makeFloor() {
  const f = floor.getContext('2d');
  f.fillStyle = '#2b2d33'; f.fillRect(0, 0, W, H);
  for (let y = 0; y < H; y += 80) for (let x = 0; x < W; x += 80) {
    const v = rint(-6, 6); f.fillStyle = `rgb(${43 + v},${45 + v},${51 + v})`; f.fillRect(x + 1, y + 1, 78, 78);
  }
  f.strokeStyle = 'rgba(0,0,0,.35)'; f.lineWidth = 2;
  for (let i = 0; i < 40; i++) { // rachaduras
    let x = rnd(0, W), y = rnd(0, H); f.beginPath(); f.moveTo(x, y);
    for (let k = 0; k < 6; k++) { x += rnd(-30, 30); y += rnd(-30, 30); f.lineTo(x, y); } f.stroke();
  }
  // estrela gigante desbotada no centro
  f.save(); f.translate(W / 2, H / 2); f.fillStyle = 'rgba(255,255,255,.06)'; f.beginPath();
  for (let i = 0; i < 10; i++) { const r = i % 2 ? 90 : 230, a = -Math.PI / 2 + i * Math.PI / 5; f.lineTo(Math.cos(a) * r, Math.sin(a) * r); }
  f.closePath(); f.fill(); f.restore();
  f.strokeStyle = 'rgba(255,200,0,.25)'; f.lineWidth = 6; f.strokeRect(14, 14, W - 28, H - 28);
})();

// ---------- áudio sintetizado ----------
let AC = null, laserOsc = null, laserGain = null;
function audio() {
  if (!AC) {
    try {
      AC = new (window.AudioContext || window.webkitAudioContext)();
      laserOsc = AC.createOscillator(); laserOsc.type = 'sawtooth'; laserOsc.frequency.value = 95;
      const lfo = AC.createOscillator(); lfo.frequency.value = 30; const lg = AC.createGain(); lg.gain.value = 25;
      lfo.connect(lg); lg.connect(laserOsc.frequency); lfo.start();
      laserGain = AC.createGain(); laserGain.gain.value = 0;
      laserOsc.connect(laserGain); laserGain.connect(AC.destination); laserOsc.start();
    } catch (e) { AC = null; }
  }
  return AC;
}
function noise(dur, freq, vol) {
  const a = audio(); if (!a) return;
  const n = Math.floor(a.sampleRate * dur), buf = a.createBuffer(1, n, a.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
  const s = a.createBufferSource(); s.buffer = buf;
  const f = a.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = freq;
  const g = a.createGain(); g.gain.value = vol;
  s.connect(f); f.connect(g); g.connect(a.destination); s.start();
}
function thump(f0, f1, dur, vol) {
  const a = audio(); if (!a) return;
  const o = a.createOscillator(), g = a.createGain();
  o.frequency.setValueAtTime(f0, a.currentTime); o.frequency.exponentialRampToValueAtTime(f1, a.currentTime + dur);
  g.gain.setValueAtTime(vol, a.currentTime); g.gain.exponentialRampToValueAtTime(0.001, a.currentTime + dur);
  o.connect(g); g.connect(a.destination); o.start(); o.stop(a.currentTime + dur);
}
const sfx = {
  splat() { noise(0.35, 900, 0.5); thump(120, 40, 0.25, 0.5); },
  burst() { noise(0.7, 1400, 0.8); thump(90, 28, 0.5, 0.9); noise(0.25, 4000, 0.25); },
  slice() { noise(0.25, 6000, 0.3); noise(0.4, 800, 0.4); thump(160, 50, 0.2, 0.4); },
  punch() { thump(220, 35, 0.35, 0.9); noise(0.2, 2500, 0.4); },
  hurt() { thump(180, 60, 0.2, 0.5); },
  shoot() { noise(0.08, 3000, 0.12); },
  boom() { noise(0.9, 700, 0.9); thump(70, 25, 0.7, 1); }
};

// ---------- entrada ----------
const keys = {}; let mouse = { x: W / 2, y: H / 2, down: false, right: false };
addEventListener('keydown', e => {
  keys[e.code] = true; audio();
  if (['Space', 'ArrowUp', 'ArrowDown'].includes(e.code)) e.preventDefault();
  if (e.code === 'KeyP' && G.state === 'play') G.paused = !G.paused;
  if ((e.code === 'Enter' || e.code === 'KeyR') && G.state !== 'play') startGame();
});
addEventListener('keyup', e => keys[e.code] = false);
function setMouse(e) {
  const r = cv.getBoundingClientRect();
  mouse.x = (e.clientX - r.left) * W / r.width; mouse.y = (e.clientY - r.top) * H / r.height;
}
cv.addEventListener('mousemove', setMouse);
cv.addEventListener('mousedown', e => { setMouse(e); audio(); if (e.button === 0) mouse.down = true; if (e.button === 2) mouse.right = true; if (G.state !== 'play') startGame(); });
addEventListener('mouseup', e => { if (e.button === 0) mouse.down = false; if (e.button === 2) mouse.right = false; });
cv.addEventListener('contextmenu', e => e.preventDefault());

// ---------- estado ----------
const G = { state: 'menu', paused: false, t: 0, shake: 0, freeze: 0, flash: 0, wave: 0, score: 0, kills: 0, combo: 0, comboT: 0, best: 0, spawnQ: [], spawnT: 0, breakT: 0, bannerT: 0 };
let P, enemies, bullets, gibs, drops, popups, sparks, fires;

function startGame() {
  audio();
  G.state = 'play'; G.paused = false; G.t = 0; G.shake = 0; G.freeze = 0; G.wave = 0; G.score = 0; G.kills = 0; G.combo = 0; G.comboT = 0;
  G.spawnQ = []; G.breakT = 1.2; G.bannerT = 0;
  enemies = []; bullets = []; gibs = []; drops = []; popups = []; sparks = []; fires = [];
  bctx.clearRect(0, 0, W, H);
  P = { x: W / 2, y: H / 2, vx: 0, vy: 0, a: 0, hp: 100, en: 100, over: false, dash: 0, dashCd: 0, dx: 0, dy: 0, inv: 0, firing: false, capeT: 0, cape: [] };
}

// ---------- gore ----------
const SKIN = ['#e8b894', '#c98f6a', '#8a5a3c', '#f0c8a8'];
function stain(x, y, size, ang, spread, dark) {
  const n = Math.floor(size / 2.2) + 2;
  for (let i = 0; i < n; i++) {
    const a = ang == null ? rnd(0, TAU) : ang + rnd(-spread / 2, spread / 2);
    const d = rnd(0, size) * rnd(0.3, 1.5), r = rnd(1.5, Math.max(2.5, size * 0.17));
    bctx.fillStyle = `rgba(${rint(85, 150)},${rint(0, 8)},${rint(4, 20)},${rnd(0.45, 0.9)})`;
    bctx.beginPath(); bctx.arc(x + Math.cos(a) * d, y + Math.sin(a) * d, r, 0, TAU); bctx.fill();
    if (Math.random() < 0.25) { // gotejado / esguicho comprido
      bctx.strokeStyle = bctx.fillStyle; bctx.lineWidth = r * 0.7; bctx.beginPath();
      bctx.moveTo(x, y); bctx.lineTo(x + Math.cos(a) * d * 1.4, y + Math.sin(a) * d * 1.4); bctx.stroke();
    }
  }
  if (dark) { bctx.fillStyle = 'rgba(40,0,6,.55)'; bctx.beginPath(); bctx.arc(x, y, size * 0.35, 0, TAU); bctx.fill(); }
}
function scorch(x, y, r) {
  bctx.fillStyle = 'rgba(0,0,0,.2)'; bctx.beginPath(); bctx.arc(x + rnd(-3, 3), y + rnd(-3, 3), r, 0, TAU); bctx.fill();
}
function spray(x, y, ang, spread, n, spd, col) {
  for (let i = 0; i < n; i++) {
    if (drops.length > 1500) break;
    const a = ang == null ? rnd(0, TAU) : ang + rnd(-spread / 2, spread / 2), s = rnd(0.15, 1) * spd;
    drops.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: rnd(0.3, 1.1), r: rnd(1.5, 4.2), col: col || null });
  }
}
function gib(x, y, type, size, col, ang, spd) {
  if (gibs.length > 420) { const g = gibs.shift(); drawGib(bctx, g); }
  const a = ang == null ? rnd(0, TAU) : ang + rnd(-0.7, 0.7), s = rnd(0.4, 1) * spd;
  gibs.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, rot: rnd(0, TAU), vr: rnd(-14, 14), type, s: size, col, skin: pick(SKIN), life: rnd(0.8, 2.2) });
}
function drawGib(c, g) {
  c.save(); c.translate(g.x, g.y); c.rotate(g.rot);
  const s = g.s;
  switch (g.type) {
    case 'head':
      c.fillStyle = g.skin; c.beginPath(); c.arc(0, 0, s, 0, TAU); c.fill();
      c.fillStyle = '#3a2a1a'; c.beginPath(); c.arc(0, 0, s, Math.PI * 0.9, Math.PI * 2.1); c.fill();
      c.fillStyle = '#fff'; c.beginPath(); c.arc(s * 0.4, -s * 0.3, s * 0.18, 0, TAU); c.arc(s * 0.4, s * 0.3, s * 0.18, 0, TAU); c.fill();
      c.fillStyle = '#7a0010'; c.beginPath(); c.arc(-s * 0.9, 0, s * 0.45, 0, TAU); c.fill(); break;
    case 'limb':
      c.fillStyle = g.col; c.fillRect(-s, -s * 0.28, s * 1.7, s * 0.56);
      c.fillStyle = g.skin; c.beginPath(); c.arc(s * 0.75, 0, s * 0.3, 0, TAU); c.fill();
      c.fillStyle = '#8a0014'; c.fillRect(-s * 1.05, -s * 0.3, s * 0.25, s * 0.6);
      c.fillStyle = '#eee'; c.fillRect(-s * 1.12, -s * 0.08, s * 0.2, s * 0.16); break;
    case 'torso':
      c.fillStyle = g.col; c.beginPath(); c.arc(0, 0, s, -Math.PI / 2, Math.PI / 2); c.closePath(); c.fill();
      c.fillStyle = '#a0001a'; c.fillRect(-s * 0.15, -s, s * 0.3, s * 2);
      c.fillStyle = '#d8506a'; for (let i = -2; i <= 2; i++) c.fillRect(-s * 0.25, i * s * 0.3 - 2, s * 0.3, 3); break;
    case 'organ':
      c.fillStyle = pick(['#a3122c', '#c42848', '#7a0c1e', '#d4607a']);
      c.beginPath(); c.ellipse(0, 0, s, s * 0.6, 0, 0, TAU); c.fill();
      c.fillStyle = 'rgba(255,255,255,.35)'; c.beginPath(); c.ellipse(-s * 0.3, -s * 0.2, s * 0.3, s * 0.15, 0, 0, TAU); c.fill(); break;
    case 'gut':
      c.strokeStyle = '#d4607a'; c.lineWidth = s * 0.5; c.lineCap = 'round'; c.beginPath(); c.moveTo(-s * 2, 0);
      c.bezierCurveTo(-s, -s, s, s, s * 2, 0); c.stroke(); break;
    case 'bone':
      c.strokeStyle = '#f0ead8'; c.lineWidth = s * 0.35; c.lineCap = 'round'; c.beginPath(); c.moveTo(-s, 0); c.lineTo(s, 0); c.stroke(); break;
    default: // meat
      c.fillStyle = pick(['#8a0f22', '#b01e36', '#601020']); c.beginPath(); c.arc(0, 0, s, 0, TAU); c.fill();
  }
  c.restore();
}

function killEnemy(e, mode, ang) {
  e.dead = true;
  const R = e.r, big = R / 14;
  const col = e.col;
  let label = null;
  if (mode === 'slice') {
    sfx.slice(); G.shake = Math.max(G.shake, 6 * big);
    const perp = ang + Math.PI / 2;
    stain(e.x, e.y, 60 * big, null, 0, true);
    for (const sgn of [-1, 1]) {
      gib(e.x, e.y, 'torso', R, col, perp + (sgn < 0 ? Math.PI : 0), 150);
      gib(e.x, e.y, 'limb', R * 0.7, col, perp + (sgn < 0 ? Math.PI : 0), 260);
      spray(e.x, e.y, perp + (sgn < 0 ? Math.PI : 0), 1.2, 25 * big, 420);
    }
    gib(e.x, e.y, 'head', R * 0.5, null, ang, 220);
    for (let i = 0; i < 4 * big; i++) gib(e.x, e.y, pick(['organ', 'gut', 'meat']), rnd(3, 6), null, null, 260);
    spray(e.x, e.y, null, 0, 18, 220);
    label = pick(['FATIADO!', 'AO MEIO!', 'LASERADO!']);
  } else { // burst: explode em pedaços
    sfx.burst(); G.shake = Math.max(G.shake, 16 * big); G.freeze = 0.07; G.flash = 0.25;
    stain(e.x, e.y, 130 * big, null, 0, true);
    stain(e.x + Math.cos(ang) * 60, e.y + Math.sin(ang) * 60, 90 * big, ang, 1.6);
    gib(e.x, e.y, 'head', R * 0.5, null, ang, 750);
    for (let i = 0; i < 4; i++) gib(e.x, e.y, 'limb', R * 0.7, col, ang, 600);
    for (let i = 0; i < 3; i++) gib(e.x, e.y, 'torso', R * rnd(0.4, 0.7), col, ang, 480);
    for (let i = 0; i < 8 * big; i++) gib(e.x, e.y, pick(['organ', 'organ', 'gut']), rnd(3, 7), null, null, 520);
    for (let i = 0; i < 5; i++) gib(e.x, e.y, 'bone', rnd(5, 9), null, null, 560);
    for (let i = 0; i < 14 * big; i++) gib(e.x, e.y, 'meat', rnd(2, 5), null, null, 600);
    spray(e.x, e.y, ang, 1.4, 70 * big, 800); spray(e.x, e.y, null, 0, 70 * big, 450);
    label = pick(['DESTROÇADO!', 'EXPLODIU!', 'VIROU PASTA!', 'SPLASH!']);
  }
  G.kills++; G.combo++; G.comboT = 2.6;
  const pts = Math.round(e.score * (1 + (G.combo - 1) * 0.25));
  G.score += pts;
  P.hp = Math.min(100, P.hp + (mode === 'burst' ? 7 : 4)); P.en = Math.min(100, P.en + 10);
  popups.push({ x: e.x, y: e.y - 20, txt: label + ' +' + pts, life: 1.1, col: mode === 'burst' ? '#ff4060' : '#ffd040' });
  if (G.combo >= 5 && G.combo % 5 === 0) popups.push({ x: W / 2, y: 140, txt: 'COMBO x' + G.combo + ' — O POVO ADORA!', life: 1.6, col: '#fff', big: true });
}

// ---------- inimigos ----------
const DEF = {
  grunt: { r: 14, hp: 30, spd: 95, col: '#4f6338', score: 100, shoot: [1.4, 2.4], keep: [260, 420] },
  runner: { r: 12, hp: 22, spd: 215, col: '#8b3a3a', score: 120, melee: true, keep: [0, 0] },
  heavy: { r: 21, hp: 170, spd: 58, col: '#3a4258', score: 300, shoot: [1.8, 2.6], keep: [220, 380] },
  rocket: { r: 15, hp: 45, spd: 72, col: '#6b5a2a', score: 250, shoot: [2.8, 3.8], keep: [380, 520] },
  boss: { r: 48, hp: 1100, spd: 48, col: '#2a2a30', score: 3000, shoot: [1.6, 2.0], keep: [260, 380] }
};
function spawnEnemy(type) {
  const d = DEF[type]; let x, y, tries = 0;
  do {
    const s = rint(0, 3);
    x = s === 0 ? 40 : s === 1 ? W - 40 : rnd(40, W - 40);
    y = s === 2 ? 40 : s === 3 ? H - 40 : rnd(40, H - 40);
  } while (Math.hypot(x - P.x, y - P.y) < 350 && ++tries < 20);
  enemies.push({ type, x, y, vx: 0, vy: 0, a: 0, r: d.r, hp: d.hp, max: d.hp, spd: d.spd, col: d.col, score: d.score, cd: rnd(0.6, 2), flash: 0, hitCd: 0, dead: false, born: 0.4 });
  for (let i = 0; i < 6; i++) sparks.push({ x, y, vx: rnd(-80, 80), vy: rnd(-80, 80), life: 0.4, col: '#9cf' });
}
function buildWave(n) {
  const list = [], cnt = 6 + n * 3;
  for (let i = 0; i < cnt; i++) {
    const r = Math.random();
    let t = 'grunt';
    if (n >= 4 && r < 0.12) t = 'rocket';
    else if (n >= 3 && r < 0.26) t = 'heavy';
    else if (n >= 2 && r < 0.55) t = 'runner';
    list.push(t);
  }
  if (n % 5 === 0) list.push('boss');
  return list;
}
function shootAt(e, kind) {
  sfx.shoot();
  const base = Math.atan2(P.y - e.y, P.x - e.x);
  if (kind === 'boss') {
    const n = 18, off = rnd(0, TAU);
    for (let i = 0; i < n; i++) { const a = off + i * TAU / n; bullets.push({ x: e.x, y: e.y, vx: Math.cos(a) * 250, vy: Math.sin(a) * 250, r: 6, dmg: 8 }); }
    if (Math.random() < 0.5) spawnEnemy('runner');
  } else if (kind === 'heavy') {
    for (let i = -1; i <= 1; i++) { const a = base + i * 0.17; bullets.push({ x: e.x, y: e.y, vx: Math.cos(a) * 340, vy: Math.sin(a) * 340, r: 5, dmg: 7 }); }
  } else if (kind === 'rocket') {
    bullets.push({ x: e.x, y: e.y, vx: Math.cos(base) * 250, vy: Math.sin(base) * 250, r: 8, dmg: 22, rocket: true });
  } else {
    const a = base + rnd(-0.07, 0.07); bullets.push({ x: e.x, y: e.y, vx: Math.cos(a) * 380, vy: Math.sin(a) * 380, r: 4, dmg: 6 });
  }
}
function explode(x, y, r) {
  sfx.boom(); G.shake = Math.max(G.shake, 14);
  for (let i = 0; i < 40; i++) { const a = rnd(0, TAU), s = rnd(40, 320); sparks.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: rnd(0.3, 0.8), col: pick(['#ff8a20', '#ffd040', '#ff3010']) }); }
  scorch(x, y, r * 0.8); scorch(x, y, r * 0.5);
  if (Math.hypot(P.x - x, P.y - y) < r) hurt(22, Math.atan2(P.y - y, P.x - x));
}

// ---------- herói ----------
function hurt(n, ang) {
  if (P.inv > 0 || P.dash > 0 || P.over) return;
  P.hp -= n; P.inv = 0.18; G.shake = Math.max(G.shake, 7); G.flash = 0.12; sfx.hurt();
  spray(P.x, P.y, ang, 1.3, 14, 320); stain(P.x, P.y, 20, null, 0);
  if (P.hp <= 0) heroDeath();
}
function heroDeath() {
  P.over = true; G.state = 'over'; G.best = Math.max(G.best, G.score);
  const e = { x: P.x, y: P.y, r: 18, col: '#1c3fa8', score: 0 };
  mouse.down = false; mouse.right = false;
  const keepScore = G.score, keepKills = G.kills; killEnemy(e, 'burst', rnd(0, TAU)); G.score = keepScore; G.kills = keepKills; P.hp = 0;
  sfx.burst(); G.shake = 30;
  for (let i = 0; i < 40; i++) gib(P.x, P.y, 'meat', rnd(3, 6), null, null, 700);
  G.flash = 0.6; G.overT = 0;
}

function updatePlayer(dt) {
  P.a = Math.atan2(mouse.y - P.y, mouse.x - P.x);
  let ax = (keys.KeyD || keys.ArrowRight ? 1 : 0) - (keys.KeyA || keys.ArrowLeft ? 1 : 0);
  let ay = (keys.KeyS || keys.ArrowDown ? 1 : 0) - (keys.KeyW || keys.ArrowUp ? 1 : 0);
  const l = Math.hypot(ax, ay) || 1; ax /= l; ay /= l;
  P.inv = Math.max(0, P.inv - dt); P.dashCd = Math.max(0, P.dashCd - dt);
  if ((keys.Space || mouse.right) && P.dashCd <= 0 && P.dash <= 0) {
    P.dash = 0.24; P.dashCd = 0.95; P.dx = Math.cos(P.a); P.dy = Math.sin(P.a); sfx.punch(); G.shake = Math.max(G.shake, 5);
  }
  if (P.dash > 0) {
    P.dash -= dt; P.vx = P.dx * 1500; P.vy = P.dy * 1500;
    for (const e of enemies) {
      if (e.dead || e.hitCd > 0) continue;
      if (Math.hypot(e.x - P.x, e.y - P.y) < e.r + 30) {
        e.hp -= 220; e.hitCd = 0.2; e.flash = 0.1;
        if (e.hp <= 0) killEnemy(e, 'burst', P.a);
        else { sfx.splat(); spray(e.x, e.y, P.a, 1, 30, 600); stain(e.x, e.y, 50, P.a, 1.2); G.shake = 12; G.freeze = 0.05; e.vx = P.dx * 700; e.vy = P.dy * 700; }
      }
    }
    sparks.push({ x: P.x, y: P.y, vx: rnd(-30, 30), vy: rnd(-30, 30), life: 0.3, col: '#fff' });
  } else {
    const acc = 2400, max = 330;
    P.vx += ax * acc * dt; P.vy += ay * acc * dt;
    const f = Math.pow(0.0008, dt); P.vx *= f; P.vy *= f;
    const sp = Math.hypot(P.vx, P.vy); if (sp > max) { P.vx *= max / sp; P.vy *= max / sp; }
  }
  P.x = clamp(P.x + P.vx * dt, 28, W - 28); P.y = clamp(P.y + P.vy * dt, 28, H - 28);
  // capa
  P.cape.unshift({ x: P.x, y: P.y }); if (P.cape.length > 9) P.cape.pop();
  // laser
  P.firing = mouse.down && P.en > 0 && !P.overheat && P.dash <= 0;
  if (P.firing) { P.en -= 28 * dt; if (P.en <= 0) { P.en = 0; P.overheat = true; } }
  else { P.en = Math.min(100, P.en + 22 * dt); if (P.overheat && P.en > 30) P.overheat = false; }
  if (P.firing) fireLaser(dt);
  if (laserGain) laserGain.gain.value = P.firing ? 0.07 : 0;
}
function fireLaser(dt) {
  const dx = Math.cos(P.a), dy = Math.sin(P.a), ox = P.x + dx * 14, oy = P.y + dy * 14;
  // comprimento até a borda da arena
  let L = 2000;
  if (dx > 0) L = Math.min(L, (W - 14 - ox) / dx); else if (dx < 0) L = Math.min(L, (14 - ox) / dx);
  if (dy > 0) L = Math.min(L, (H - 14 - oy) / dy); else if (dy < 0) L = Math.min(L, (14 - oy) / dy);
  P.beam = { x: ox, y: oy, ex: ox + dx * L, ey: oy + dy * L };
  for (const e of enemies) {
    if (e.dead) continue;
    const t = clamp((e.x - ox) * dx + (e.y - oy) * dy, 0, L);
    const px = ox + dx * t, py = oy + dy * t;
    if (Math.hypot(e.x - px, e.y - py) < e.r + 5) {
      e.hp -= 150 * dt; e.flash = 0.05;
      if (Math.random() < 0.5) spray(e.x, e.y, P.a, 1.6, 2, 300);
      if (Math.random() < 0.15) stain(e.x, e.y, 14, P.a, 1);
      if (e.hp <= 0) killEnemy(e, 'slice', P.a);
    }
  }
  for (const b of bullets) { // laser vaporiza projéteis
    const t = clamp((b.x - ox) * dx + (b.y - oy) * dy, 0, L);
    if (Math.hypot(b.x - (ox + dx * t), b.y - (oy + dy * t)) < b.r + 6) { b.dead = true; if (b.rocket) explode(b.x, b.y, 90); }
  }
  if (Math.random() < 0.6) { scorch(P.beam.ex, P.beam.ey, rnd(2, 5)); sparks.push({ x: P.beam.ex, y: P.beam.ey, vx: rnd(-200, 200), vy: rnd(-200, 200), life: 0.3, col: '#ffb040' }); }
}

// ---------- atualização ----------
function updateEnemy(e, dt) {
  e.flash = Math.max(0, e.flash - dt); e.hitCd = Math.max(0, e.hitCd - dt); e.born = Math.max(0, e.born - dt);
  const dx = P.x - e.x, dy = P.y - e.y, dist = Math.hypot(dx, dy) || 1;
  e.a = Math.atan2(dy, dx);
  const d = DEF[e.type];
  let mv = 0;
  if (d.melee) mv = 1;
  else if (dist > d.keep[1]) mv = 1; else if (dist < d.keep[0]) mv = -0.8;
  e.vx += (dx / dist * mv * e.spd - e.vx) * Math.min(1, 6 * dt);
  e.vy += (dy / dist * mv * e.spd - e.vy) * Math.min(1, 6 * dt);
  for (const o of enemies) { // separação
    if (o === e || o.dead) continue;
    const ox = e.x - o.x, oy = e.y - o.y, od = Math.hypot(ox, oy), mind = e.r + o.r;
    if (od > 0 && od < mind) { e.x += ox / od * (mind - od) * 0.5; e.y += oy / od * (mind - od) * 0.5; }
  }
  e.x = clamp(e.x + e.vx * dt, 20, W - 20); e.y = clamp(e.y + e.vy * dt, 20, H - 20);
  if (d.shoot && e.born <= 0) { e.cd -= dt; if (e.cd <= 0) { e.cd = rnd(d.shoot[0], d.shoot[1]); shootAt(e, e.type); } }
  if (d.melee && dist < e.r + 20 && e.born <= 0) hurt(10, e.a);
  else if (e.type === 'boss' && dist < e.r + 24) hurt(18, e.a);
}
function update(dt) {
  G.t += dt;
  updatePlayer(dt);
  // ondas
  if (G.spawnQ.length) {
    G.spawnT -= dt;
    if (G.spawnT <= 0) { spawnEnemy(G.spawnQ.shift()); G.spawnT = rnd(0.3, 0.8); }
  } else if (!enemies.some(e => !e.dead)) {
    G.breakT -= dt;
    if (G.breakT <= 0) { G.wave++; G.spawnQ = buildWave(G.wave); G.breakT = 3; G.bannerT = 2.2; }
  }
  G.bannerT = Math.max(0, G.bannerT - dt);
  for (const e of enemies) if (!e.dead) updateEnemy(e, dt);
  enemies = enemies.filter(e => !e.dead);
  for (const b of bullets) {
    b.x += b.vx * dt; b.y += b.vy * dt;
    if (b.rocket && Math.random() < 0.6) sparks.push({ x: b.x, y: b.y, vx: rnd(-20, 20), vy: rnd(-20, 20), life: 0.4, col: '#ffa040' });
    if (b.x < -20 || b.x > W + 20 || b.y < -20 || b.y > H + 20) b.dead = true;
    else if (Math.hypot(b.x - P.x, b.y - P.y) < b.r + 16 && !P.over) {
      if (P.dash > 0) continue;
      b.dead = true; if (b.rocket) explode(b.x, b.y, 90); else hurt(b.dmg, Math.atan2(b.vy, b.vx));
    }
  }
  bullets = bullets.filter(b => !b.dead);
  for (const g of gibs) {
    g.x += g.vx * dt; g.y += g.vy * dt; g.rot += g.vr * dt;
    const f = Math.pow(0.04, dt); g.vx *= f; g.vy *= f; g.vr *= f; g.life -= dt;
    const sp = Math.hypot(g.vx, g.vy);
    if (sp > 60 && Math.random() < 0.5) stain(g.x, g.y, 5, null, 0);
    if (g.x < 10 || g.x > W - 10) g.vx *= -0.5; if (g.y < 10 || g.y > H - 10) g.vy *= -0.5;
    g.x = clamp(g.x, 8, W - 8); g.y = clamp(g.y, 8, H - 8);
    if (g.life <= 0 || sp < 6) { drawGib(bctx, g); g.dead = true; }
  }
  gibs = gibs.filter(g => !g.dead);
  for (const d of drops) {
    d.x += d.vx * dt; d.y += d.vy * dt; const f = Math.pow(0.02, dt); d.vx *= f; d.vy *= f; d.life -= dt;
    if (d.life <= 0) { bctx.fillStyle = `rgba(${rint(100, 160)},0,${rint(6, 18)},.8)`; bctx.beginPath(); bctx.arc(d.x, d.y, d.r * rnd(0.7, 1.5), 0, TAU); bctx.fill(); d.dead = true; }
  }
  drops = drops.filter(d => !d.dead);
  for (const s of sparks) { s.x += s.vx * dt; s.y += s.vy * dt; s.life -= dt; }
  sparks = sparks.filter(s => s.life > 0);
  for (const p of popups) { p.y -= 30 * dt; p.life -= dt; }
  popups = popups.filter(p => p.life > 0);
  G.comboT -= dt; if (G.comboT <= 0) G.combo = 0;
  G.shake = Math.max(0, G.shake - 40 * dt); G.flash = Math.max(0, G.flash - dt);
}

// ---------- desenho ----------
function drawEnemy(e) {
  ctx.save(); ctx.translate(e.x, e.y);
  if (e.born > 0) { ctx.globalAlpha = 1 - e.born / 0.4; }
  ctx.fillStyle = 'rgba(0,0,0,.35)'; ctx.beginPath(); ctx.ellipse(3, 5, e.r, e.r * 0.8, 0, 0, TAU); ctx.fill();
  ctx.rotate(e.a);
  const c = e.flash > 0 ? '#fff' : e.col;
  ctx.fillStyle = c; ctx.beginPath(); ctx.ellipse(0, 0, e.r * 0.8, e.r, 0, 0, TAU); ctx.fill();
  ctx.fillStyle = e.flash > 0 ? '#fff' : '#222'; // arma
  if (e.type === 'rocket') ctx.fillRect(2, -4, e.r + 14, 8); else if (e.type !== 'runner') ctx.fillRect(4, 3, e.r + 8, 5);
  ctx.fillStyle = e.flash > 0 ? '#fff' : (e.type === 'runner' ? '#e8b894' : '#303830');
  ctx.beginPath(); ctx.arc(2, 0, e.r * 0.5, 0, TAU); ctx.fill();
  if (e.type === 'boss') { ctx.fillStyle = '#c00'; ctx.fillRect(e.r * 0.2, -6, e.r * 0.5, 12); }
  if (e.type === 'heavy') { ctx.strokeStyle = '#789'; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(0, 0, e.r * 0.95, -1, 1); ctx.stroke(); }
  ctx.restore();
  if (e.hp < e.max) { // barra de vida
    ctx.fillStyle = '#000a'; ctx.fillRect(e.x - e.r, e.y - e.r - 12, e.r * 2, 4);
    ctx.fillStyle = '#d02040'; ctx.fillRect(e.x - e.r, e.y - e.r - 12, e.r * 2 * Math.max(0, e.hp / e.max), 4);
  }
}
function drawStar(c, r) {
  c.beginPath();
  for (let i = 0; i < 10; i++) { const rr = i % 2 ? r * 0.4 : r, a = -Math.PI / 2 + i * Math.PI / 5; c.lineTo(Math.cos(a) * rr, Math.sin(a) * rr); }
  c.closePath(); c.fill();
}
function drawHero() {
  // capa (rastro vermelho)
  ctx.save();
  ctx.strokeStyle = '#b01020'; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  for (let i = P.cape.length - 1; i > 0; i--) {
    const a = P.cape[i], b = P.cape[i - 1];
    ctx.lineWidth = 34 - i * 2.8; ctx.globalAlpha = 1 - i * 0.08;
    ctx.beginPath(); ctx.moveTo(a.x - Math.sin(i) * 3, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
  }
  ctx.restore();
  ctx.save(); ctx.translate(P.x, P.y);
  ctx.fillStyle = 'rgba(0,0,0,.4)'; ctx.beginPath(); ctx.ellipse(6, 10, 22, 17, 0, 0, TAU); ctx.fill();
  if (P.dash > 0) { ctx.strokeStyle = '#fff8'; ctx.lineWidth = 3; for (let i = 0; i < 6; i++) { ctx.beginPath(); const o = rnd(-18, 18); ctx.moveTo(-P.dx * 30 - P.dy * o, -P.dy * 30 + P.dx * o); ctx.lineTo(-P.dx * 90 - P.dy * o, -P.dy * 90 + P.dx * o); ctx.stroke(); } }
  ctx.rotate(P.a);
  if (P.inv > 0 && Math.floor(G.t * 30) % 2) ctx.globalAlpha = 0.5;
  // ombros / torso azul
  ctx.fillStyle = '#1c3fa8'; ctx.beginPath(); ctx.ellipse(0, 0, 14, 22, 0, 0, TAU); ctx.fill();
  ctx.fillStyle = '#fff'; ctx.save(); ctx.rotate(Math.PI / 2); ctx.translate(0, -2); drawStar(ctx, 7); ctx.restore();
  // braços / punhos
  const fist = P.dash > 0 ? 34 : 20;
  ctx.fillStyle = '#c8202a'; ctx.fillRect(0, -19, fist, 7); ctx.fillRect(0, 12, fist, 7);
  ctx.fillStyle = '#ffe4c0'; ctx.beginPath(); ctx.arc(fist + 1, -16, 6, 0, TAU); ctx.arc(fist + 1, 16, 6, 0, TAU); ctx.fill();
  // cabeça
  ctx.fillStyle = '#f2c89c'; ctx.beginPath(); ctx.arc(2, 0, 10, 0, TAU); ctx.fill();
  ctx.fillStyle = '#e6c04a'; ctx.beginPath(); ctx.arc(0, 0, 10.5, Math.PI * 0.55, Math.PI * 1.45); ctx.fill();
  ctx.fillStyle = P.firing ? '#ff2020' : '#fff';
  ctx.shadowColor = '#f00'; ctx.shadowBlur = P.firing ? 14 : 0;
  ctx.beginPath(); ctx.arc(10, -4, 2.2, 0, TAU); ctx.arc(10, 4, 2.2, 0, TAU); ctx.fill();
  ctx.restore();
}
function drawBeam() {
  if (!P.firing || !P.beam) return;
  const b = P.beam, dx = Math.cos(P.a), dy = Math.sin(P.a);
  ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.lineCap = 'round';
  for (const side of [-4, 4]) {
    const sx = b.x - dy * side, sy = b.y + dx * side, ex = b.ex - dy * side * 0.2, ey = b.ey + dx * side * 0.2;
    ctx.strokeStyle = 'rgba(255,30,30,.25)'; ctx.lineWidth = 18; ctx.beginPath(); ctx.moveTo(sx, sy); ctx.lineTo(ex, ey); ctx.stroke();
    ctx.strokeStyle = 'rgba(255,90,40,.7)'; ctx.lineWidth = 7 + Math.sin(G.t * 60) * 1.5; ctx.beginPath(); ctx.moveTo(sx, sy); ctx.lineTo(ex, ey); ctx.stroke();
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(sx, sy); ctx.lineTo(ex, ey); ctx.stroke();
  }
  const g = ctx.createRadialGradient(b.ex, b.ey, 0, b.ex, b.ey, 40);
  g.addColorStop(0, 'rgba(255,200,100,.9)'); g.addColorStop(1, 'rgba(255,40,0,0)');
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(b.ex, b.ey, 40, 0, TAU); ctx.fill();
  ctx.restore();
}
function drawHUD() {
  ctx.save(); ctx.textBaseline = 'top';
  const bar = (x, y, w, h, v, col, label) => {
    ctx.fillStyle = '#000b'; ctx.fillRect(x - 2, y - 2, w + 4, h + 4);
    ctx.fillStyle = col; ctx.fillRect(x, y, w * clamp(v, 0, 1), h);
    ctx.fillStyle = '#fff'; ctx.font = '13px Impact,sans-serif'; ctx.fillText(label, x + 6, y + 2);
  };
  bar(24, 22, 280, 22, P.hp / 100, '#c01830', 'SAÚDE');
  bar(24, 54, 280, 14, P.en / 100, P.overheat ? '#665' : '#ff7030', P.overheat ? 'OLHOS SUPERAQUECIDOS' : 'OLHOS LASER');
  bar(24, 78, 280, 10, 1 - P.dashCd / 0.95, '#3a7aff', '');
  ctx.fillStyle = '#9bf'; ctx.font = '11px Impact'; ctx.fillText('SOCO [ESPAÇO]', 30, 77);
  ctx.textAlign = 'right'; ctx.fillStyle = '#fff'; ctx.font = '34px Impact,sans-serif'; ctx.fillText(String(G.score).padStart(7, '0'), W - 24, 18);
  ctx.font = '16px Impact'; ctx.fillStyle = '#fc4'; ctx.fillText('ONDA ' + Math.max(1, G.wave) + '  •  ABATES ' + G.kills, W - 24, 58);
  if (G.combo > 1) { ctx.fillStyle = '#f46'; ctx.font = '26px Impact'; ctx.fillText('COMBO x' + G.combo, W - 24, 82); }
  ctx.restore();
}
function banner(txt, sub, col) {
  ctx.save(); ctx.textAlign = 'center';
  ctx.fillStyle = col; ctx.font = '72px Impact,sans-serif'; ctx.shadowColor = '#000'; ctx.shadowBlur = 12; ctx.fillText(txt, W / 2, H / 2 - 40);
  if (sub) { ctx.fillStyle = '#fff'; ctx.font = '22px Impact'; ctx.fillText(sub, W / 2, H / 2 + 20); }
  ctx.restore();
}
function render() {
  ctx.save();
  if (G.shake > 0) ctx.translate(rnd(-G.shake, G.shake), rnd(-G.shake, G.shake));
  ctx.drawImage(floor, 0, 0); ctx.drawImage(blood, 0, 0);
  if (G.state === 'menu') { ctx.restore(); drawMenu(); return; }
  for (const g of gibs) drawGib(ctx, g);
  for (const d of drops) { ctx.fillStyle = '#9a0012'; ctx.beginPath(); ctx.arc(d.x, d.y, d.r, 0, TAU); ctx.fill(); }
  for (const e of enemies) drawEnemy(e);
  if (!P.over) { drawHero(); drawBeam(); }
  for (const b of bullets) {
    ctx.fillStyle = b.rocket ? '#ffa040' : '#ffe060'; ctx.shadowColor = '#fa0'; ctx.shadowBlur = 8;
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, TAU); ctx.fill(); ctx.shadowBlur = 0;
  }
  ctx.globalCompositeOperation = 'lighter';
  for (const s of sparks) { ctx.globalAlpha = clamp(s.life * 3, 0, 1); ctx.fillStyle = s.col; ctx.fillRect(s.x - 2, s.y - 2, 4, 4); }
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  ctx.textAlign = 'center';
  for (const p of popups) { ctx.globalAlpha = clamp(p.life * 2, 0, 1); ctx.fillStyle = p.col; ctx.font = (p.big ? 38 : 20) + 'px Impact,sans-serif'; ctx.lineWidth = 4; ctx.strokeStyle = '#000'; ctx.strokeText(p.txt, p.x, p.y); ctx.fillText(p.txt, p.x, p.y); }
  ctx.globalAlpha = 1;
  ctx.restore();
  if (G.flash > 0) { ctx.fillStyle = `rgba(255,0,0,${Math.min(0.5, G.flash)})`; ctx.fillRect(0, 0, W, H); }
  // vinheta
  const v = ctx.createRadialGradient(W / 2, H / 2, H * 0.4, W / 2, H / 2, H * 0.95); v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,0,.6)');
  ctx.fillStyle = v; ctx.fillRect(0, 0, W, H);
  if (!P.over) drawHUD();
  if (G.state === 'play') {
    if (G.paused) banner('PAUSADO', 'Aperte P para continuar', '#fff');
    else if (G.bannerT > 0) banner(G.wave % 5 === 0 ? 'ONDA ' + G.wave + ' — CHEFE!' : 'ONDA ' + G.wave, 'Mostre a eles quem manda.', '#ffcf30');
    else if (G.wave === 0) banner('PREPARE-SE', '', '#fff');
    // mira
    ctx.strokeStyle = P.overheat ? '#888' : '#f33'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(mouse.x, mouse.y, 12, 0, TAU);
    ctx.moveTo(mouse.x - 20, mouse.y); ctx.lineTo(mouse.x - 6, mouse.y); ctx.moveTo(mouse.x + 6, mouse.y); ctx.lineTo(mouse.x + 20, mouse.y);
    ctx.moveTo(mouse.x, mouse.y - 20); ctx.lineTo(mouse.x, mouse.y - 6); ctx.moveTo(mouse.x, mouse.y + 6); ctx.lineTo(mouse.x, mouse.y + 20); ctx.stroke();
  } else if (G.state === 'over') {
    ctx.fillStyle = 'rgba(0,0,0,.55)'; ctx.fillRect(0, 0, W, H);
    banner('O HERÓI CAIU', 'Pontos: ' + G.score + '   •   Abates: ' + G.kills + '   •   Onda: ' + G.wave + '   •   Recorde: ' + G.best, '#e01830');
    ctx.fillStyle = '#fff'; ctx.font = '20px Impact'; ctx.textAlign = 'center'; ctx.fillText('Clique ou aperte ENTER para renascer', W / 2, H / 2 + 70);
  }
}
function drawMenu() {
  ctx.fillStyle = 'rgba(0,0,0,.65)'; ctx.fillRect(0, 0, W, H);
  ctx.save(); ctx.textAlign = 'center';
  ctx.shadowColor = '#000'; ctx.shadowBlur = 16;
  ctx.fillStyle = '#d01830'; ctx.font = '110px Impact,sans-serif'; ctx.fillText('CAPITÃO GLÓRIA', W / 2, 200);
  ctx.fillStyle = '#1c5ad8'; ctx.font = '36px Impact'; ctx.fillText('EDIÇÃO GORE  •  O HERÓI QUE O POVO MERECE', W / 2, 250);
  ctx.shadowBlur = 0; ctx.fillStyle = '#fff'; ctx.font = '22px Arial';
  const L = ['WASD — voar', 'MOUSE — mirar', 'BOTÃO ESQUERDO — olhos laser (fatia todo mundo)', 'ESPAÇO / BOTÃO DIREITO — soco supersônico (explode em pedaços)', 'P — pausar', '', 'Sobreviva às ondas. Cada abate restaura vida e energia. Combos valem mais.', '+18 — violência gráfica e sangue exagerado, tudo fictício.'];
  L.forEach((t, i) => ctx.fillText(t, W / 2, 330 + i * 34));
  ctx.fillStyle = '#ffcf30'; ctx.font = '40px Impact'; if (Math.floor(performance.now() / 500) % 2) ctx.fillText('CLIQUE PARA COMEÇAR', W / 2, 640);
  ctx.restore();
}

// ---------- loop ----------
let last = performance.now();
function frame(now) {
  let dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (G.state === 'menu') { render(); }
  else {
    if (G.freeze > 0) { G.freeze -= dt; dt = 0; }
    if (!G.paused) {
      if (G.state === 'play') update(dt);
      else { // game over: a cena continua rolando
        gibs.forEach(g => { g.x += g.vx * dt; g.y += g.vy * dt; g.rot += g.vr * dt; const f = Math.pow(0.04, dt); g.vx *= f; g.vy *= f; g.vr *= f; if (Math.hypot(g.vx, g.vy) < 6) { drawGib(bctx, g); g.dead = true; } });
        gibs = gibs.filter(g => !g.dead);
        drops.forEach(d => { d.x += d.vx * dt; d.y += d.vy * dt; d.vx *= 0.9; d.vy *= 0.9; d.life -= dt; if (d.life <= 0) { bctx.fillStyle = '#7a0010'; bctx.beginPath(); bctx.arc(d.x, d.y, d.r, 0, TAU); bctx.fill(); d.dead = true; } });
        drops = drops.filter(d => !d.dead);
        G.shake = Math.max(0, G.shake - 40 * dt); G.flash = Math.max(0, G.flash - dt);
        if (laserGain) laserGain.gain.value = 0;
      }
    }
    render();
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
